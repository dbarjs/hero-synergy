name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs without a VS Code: build, format, lint, types, the Vitest tiers.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run -r build
      - run: vp check
      - run: vp test --coverage
      - run: vp run --filter hero-synergy typecheck
      # The VSIX the registries will get, built from this commit; the file list is the one the
      # manifest's `files` allows and nothing else.
      - run: vp run --filter hero-synergy package --out hero-synergy.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: hero-synergy-vsix
          path: packages/vscode/hero-synergy.vsix
          if-no-files-found: error

  # The one job that calls GitHub for real: the collect against this repo's own maps, with the
  # workflow token. Not a required check, so an outage at GitHub never blocks a merge; every
  # other test replays recordings and needs no credentials.
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp test --project live
        env:
          GH_TOKEN: ${{ github.token }}

  # The two tiers that need a real VS Code: the Mocha host tier on the floor and on stable, then
  # the Playwright-driven e2e project. Linux runs under xvfb; macOS has a window server.
  vscode:
    name: vscode (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      # The downloads are keyed by OS, architecture, the floor (in .vscode-test.mjs) and today's
      # stable, so a new VS Code release refreshes the cache and nothing else does.
      - id: stable
        run: echo "version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: packages/vscode/.vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/vscode/.vscode-test.mjs') }}-${{ steps.stable.outputs.version }}
      - run: vp run -r build
      - name: Extension-host tier (floor and stable)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} vp run --filter hero-synergy test:integration
      - name: End-to-end tier
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} vp test --project e2e
      # What the window showed when an e2e test failed: a screenshot and the workbench text.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.name }}
          path: packages/vscode/out-test/e2e-failures
          if-no-files-found: ignore
